[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editast"
version = "0.1.0"
description = "Reverse-engineer viral short-form video edits into an Abstract Syntax Tree (and render new videos from it)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
    "pydantic>=2.6",
    "rich>=13",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
fetch = ["yt-dlp"]
dev = ["pytest>=8"]

[project.scripts]
editast = "editast.cli:main"

[tool.setuptools.packages.find]
include = ["editast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
